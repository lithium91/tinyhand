name: Linux packages

on:
  push:
    branches: [main]
    tags: ["linux-v*"]
  pull_request:
    paths: ["linux/**", "assets/**", "VERSION", ".github/workflows/linux.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-good python3-xlib rpm xvfb
      - name: Check
        run: xvfb-run -a make check PY=/usr/bin/python3
      - name: Build .deb and .rpm
        run: make deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: tinyhand-linux
          path: |
            linux/dist/*.deb
            linux/dist/*.rpm
            /tmp/tinyhand-render.png
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/dist/*.deb
            linux/dist/*.rpm
